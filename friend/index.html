<script>
  // ✅ Liste autorisée en format "001", "002", ...
  const allowedIds = ["1","2","003","004","005","006","007","008","009","010"];

  function getRawId() {
    const params = new URLSearchParams(window.location.search);
    const q = params.get("id");
    if (q) return q; // cas /access/?id=001

    const parts = window.location.pathname.split("/").filter(Boolean);
    return parts[parts.length - 1]; // cas /access/001 (si jamais)
  }

  // ✅ Normalisation : "1" -> "001", "001" -> "001"
  const raw = (getRawId() || "").trim();
  const num = parseInt(raw, 10);
  const id3 = Number.isFinite(num) ? String(num).padStart(3, "0") : raw;

  // ✅ Debug visuel (pour être sûr de ce que GA et ton code voient)
  console.log("raw=", raw, "num=", num, "id3=", id3);

  if (allowedIds.includes(id3)) {

    // Event GA
    gtag('event', 'nfc_scan', {
      group: 'access',
      code: id3
    });

    // Redirect
    setTimeout(() => {
      window.location.href = "TON_LIEN_BRIDGE_AUDIO";
    }, 800);

  } else {
    document.body.innerHTML = "Access not available (id=" + raw + " → " + id3 + ")";
  }
</script>
