<script>
  // ===== CONFIG =====
  const GROUP = "friend";                 // inchangé pour Google Sheet
  const ALIAS = "fr";                     // alias public (URL)
  const WORKER_URL = "https://nfc-tracker.santesqua.workers.dev/log";
  const SECRET = "nbkbkF19_2026";

  const DEST_URL = "https://share.bridge.audio/sante-music/sante?id=17e3089c-43ad-4882-bc4d-6f7010f4ae78";

  const allowedIds = ["VBVL3V5D","D4TZ6IPD","93LKWPOJ","003","ABO4N8WC","R6ZGLP1P","F3IAPNHI","U2FQFT1I","008","Y2OTTL1V","AXT7OPAZ",
                      "6KDSW0IF","QUF1G72R","7PQ7F46G","LYPS59NG","015","ROG77RCQ","Q1TPRV65","YKOBHFRZ","Z8Y03092"];

  function normalizeCode(raw) {
    const r = (raw || "").trim();
    const num = parseInt(r, 10);
    return Number.isFinite(num) ? String(num).padStart(3, "0") : r;
  }

  function getCodeStrict() {
    const parts = window.location.pathname.split("/").filter(Boolean);

    // ✅ Doit être /fr/<code> (ou /fr/<code>/index.html)
    const aliasOk = (parts[0] || "").toLowerCase() === ALIAS;

    // Optionnel: autoriser ?id=... MAIS seulement sous /fr
    const params = new URLSearchParams(window.location.search);
    const q = params.get("id");

    if (!aliasOk) return null;

    // Si /fr/<code>
    if (parts.length >= 2 && parts[1]) return parts[1];

    // Si /fr?id=<code>
    if (q) return q;

    return null;
  }

  const raw = getCodeStrict();
  const id3 = normalizeCode(raw);

  if (!id3 || !allowedIds.includes(id3)) {
    document.body.innerHTML = "FR not available";
  } else {

    // 1) Google Analytics event (non bloquant)
    try {
      gtag("event", "nfc_scan", { group: GROUP, code: id3 });
    } catch(e) {}

    // 2) Log vers Cloudflare Worker
    try {
      const qs = new URLSearchParams({
        token: SECRET,
        group: GROUP, // garde "friend"
        code: id3,
        path: window.location.pathname + window.location.search,
        ref: document.referrer || "",
        ua: navigator.userAgent || "",
        lang: navigator.language || ""
      });

      const url = WORKER_URL + "?" + qs.toString();

      if (navigator.sendBeacon) {
        navigator.sendBeacon(url);
      } else {
        fetch(url, { mode: "no-cors", keepalive: true });
      }
    } catch(e) {}

    // 3) Redirection
    setTimeout(() => {
      window.location.replace(DEST_URL);
    }, 150);
  }
</script>
