<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Friend Redirect</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-J0RLRLT786"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-J0RLRLT786');
  </script>
</head>

<body>
  Redirection...

  <script>
    // ✅ CONFIG
    const GROUP = "friend";
    const ALLOWED_IDS = ["001","002","003","004","005","006","007","008","009","010","011","012","013","014","015","016","017","018","019","020"];

    // Cloudflare Worker endpoint (récupère IP -> ville/pays côté serveur)
    const WORKER_URL = "https://nfc-tracker.santesqua.workers.dev/log";
    const WORKER_TOKEN = "nbkbkF19_2026";

    // Destination finale
    const DEST_URL = "https://share.bridge.audio/sante-music/sante?id=17e3089c-43ad-4882-bc4d-6f7010f4ae78";

    // ✅ Helpers
    function getRawId() {
      const params = new URLSearchParams(window.location.search);
      const q = params.get("id");
      if (q) return q;

      const parts = window.location.pathname.split("/").filter(Boolean);
      return parts[parts.length - 1] || "";
    }

    function normalizeId(raw) {
      raw = String(raw || "").trim();
      const num = parseInt(raw, 10);
      return Number.isFinite(num) ? String(num).padStart(3, "0") : raw;
    }

    const id3 = normalizeId(getRawId());

    if (!ALLOWED_IDS.includes(id3)) {
      document.body.textContent = "Access not available";
    } else {

      // ✅ GA event (non bloquant)
      try {
        gtag("event", "nfc_scan", { group: GROUP, code: id3 });
      } catch (e) {}

      // ✅ Log vers Worker (non bloquant) -> Worker met ville/pays + push vers Google Sheet
      try {
        const qs = new URLSearchParams({
          token: WORKER_TOKEN,
          group: GROUP,
          code: id3,
          path: window.location.pathname + window.location.search,
          ref: document.referrer || "",
          ua: navigator.userAgent || "",
          lang: navigator.language || ""
        });

        const url = WORKER_URL + "?" + qs.toString();

        // sendBeacon = meilleur pour ne pas bloquer la redirection
        if (navigator.sendBeacon) {
          navigator.sendBeacon(url);
        } else {
          fetch(url, { mode: "no-cors", keepalive: true });
        }
      } catch (e) {}

      // ✅ Redirection "fluide"
      setTimeout(() => {
        window.location.replace(https://share.bridge.audio/sante-music/sante?id=17e3089c-43ad-4882-bc4d-6f7010f4ae78);
      }, 150); // 150ms = quasi instant + laisse le temps au beacon
    }
  </script>
</body>
</html>
