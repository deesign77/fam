<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Redirection</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-J0R1RLT786"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-J0R1RLT786');
  </script>

  <script>
    // Liste des codes friend autorisés
    const allowedIds = [1,2,3,4,5];

    // Récupère le numéro dans l’URL
function getRawId() {
  const params = new URLSearchParams(window.location.search);
  const q = params.get("id");
  if (q) return q; // cas /access/?id=001

  const parts = window.location.pathname.split("/").filter(Boolean);
  return parts[parts.length - 1]; // cas /access/001
}

const raw = getRawId();
const id = parseInt(raw, 10);

    // Vérifie si le code est autorisé
    if (allowedIds.includes(id)) {

      // Event Google Analytics
      gtag('event', 'friend_visit', {
        code: 'friend-' + id
      });

      // Redirection vers le lien Bridge des amis
      setTimeout(function () {
        window.location.href = "https://share.bridge.audio/sante-music/sante?id=17e3089c-43ad-4882-bc4d-6f7010f4ae78";
      }, 800);

    } else {
      document.body.innerHTML = "Access not available";
    }
  </script>
</head>
<body>
  Redirection…
</body>
</html>
