  <script async src="https://www.googletagmanager.com/gtag/js?id=G-J0RLRLT786"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-J0RLRLT786');
  </script>

<body>
Redirection...

<script>
  // ===== CONFIG =====
  const GROUP = "ac";
  const WORKER_URL = "https://nfc-tracker.santesqua.workers.dev/log";
  const SECRET = "nbkbkF19_2026";
  const DEST_URL = "https://share.bridge.audio/sante-music/sante-access?id=7b61bbed-409a-4ff5-950e-dbcf36cee0d9";

  const allowedIds = ["001","002","003","004","005","006","007","008","009","010","011","012","013","014","015","016","017","018","019","020"];

  function getRawId() {
    const params = new URLSearchParams(window.location.search);
    const q = params.get("id");
    if (q) return q;

    const parts = window.location.pathname.split("/").filter(Boolean);
    return parts[parts.length - 1];
  }

  const raw = (getRawId() || "").trim();
  const num = parseInt(raw, 10);
  const id3 = Number.isFinite(num) ? String(num).padStart(3, "0") : raw;

  if (!allowedIds.includes(id3)) {
    document.body.innerHTML = "Access not available";
  } else {

    // 1) Google Analytics event (non bloquant)
    try {
      gtag("event", "nfc_scan", { group: GROUP, code: id3 });
    } catch(e) {}

    // 2) Log vers Cloudflare Worker (ville + pays dès le 1er scan)
    try {
      const qs = new URLSearchParams({
        token: SECRET,
        group: GROUP,
        code: id3,
        path: window.location.pathname + window.location.search,
        ref: document.referrer || "",
        ua: navigator.userAgent || "",
        lang: navigator.language || ""
      });

      const url = WORKER_URL + "?" + qs.toString();

      if (navigator.sendBeacon) {
        navigator.sendBeacon(url);
      } else {
        fetch(url, { mode: "no-cors", keepalive: true });
      }
    } catch(e) {}

    // 3) Redirection fluide
    setTimeout(() => {
      window.location.replace(DEST_URL);
    }, 150);
  }
</script>

</body>
</html>
