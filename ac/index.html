<script>

  // ✅ Exception : ce code va vers une autre destination
const EXCEPTIONS = {
  "XE06RZIZ": "https://share.bridge.audio/sante-music/sante-morceauxprod?id=f334be15-eb20-4dc3-8dac-6b7227e3c23d"
};

  const allowedIds = ["XE06RZIZ","BJF0HV9N","CUK25GXQ","GL49VNKY","G4P4SK7O","SL6QESAF","IQ9ZC8DZ","FQ70ZTMR","UV9Z7JCA"
                      ,"VWJRL4O9","FK1OGW37","HO3F8BIU","MJVD2COC","9UFVP8CR","7BNI8795","3A2QJX7W","QY4AYCIA","Y2L015Y7","GJ4NWEHI"];

  function getRawId() {
    const params = new URLSearchParams(window.location.search);
    const q = params.get("id");
    if (q) return q;

    const parts = window.location.pathname.split("/").filter(Boolean);
    return parts[parts.length - 1];
  }

  const raw = (getRawId() || "").trim();
  const id3 = raw.toUpperCase();

  if (!allowedIds.includes(id3)) {
    document.body.innerHTML = "Access not available";
  } else {

    // 1) Google Analytics event (non bloquant)
    try {
      gtag("event", "nfc_scan", { group: GROUP, code: id3 });
    } catch(e) {}

    // 2) Log vers Cloudflare Worker (ville + pays dès le 1er scan)
    try {
      const qs = new URLSearchParams({
        token: SECRET,
        group: GROUP,
        code: id3,
        path: window.location.pathname + window.location.search,
        ref: document.referrer || "",
        ua: navigator.userAgent || "",
        lang: navigator.language || ""
      });

      const url = WORKER_URL + "?" + qs.toString();

      if (navigator.sendBeacon) {
        navigator.sendBeacon(url);
      } else {
        fetch(url, { mode: "no-cors", keepalive: true });
      }
    } catch(e) {}

    // 3) Redirection fluide
    setTimeout(() => {
      const finalUrl = EXCEPTIONS[id3] || DEST_URL;
window.location.replace(finalUrl);
    }, 150);
  }
</script>
